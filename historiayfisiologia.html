            q: "128. Si aparece Abulcasis + instrumentos quirúrgicos, ¿qué obra debes asociar?",
            options: ["A) Canon", "B) Tesrif", "C) Hawi", "D) Fusul Musa"],
            correct: 1,
            explanation: "El tratado 'Al-Tasrif' contiene el compendio clásico de instrumental quirúrgico árabe."
        },
        {
            q: "129. Si aparece Avenzoar + sarna, ¿qué microorganismo/agente debes identificar?",
            options: ["A) Sarcoptes scabiei", "B) Mycobacterium tuberculosis", "C) Plasmodium", "D) Staphylococcus"],
            correct: 0,
            explanation: "Avenzoar identificó al arador de la sarna (Sarcoptes scabiei)."
        },
        {
            q: "130. ¿Cuál asociación es completamente correcta?",
            options: ["A) Rhazes - Hawi - historias clínicas y experimentos terapéuticos", "B) Avicena - Tesrif - instrumentos quirúrgicos", "C) Avenzoar - Fusul Musa - 1,500 refranes", "D) Abulcasis - Canon - 50 volúmenes"],
            correct: 0,
            explanation: "Rhazes compiló en el Hawi historias clínicas valiosas y experimentos terapéuticos."
        }
    ];

    let score = 0;
    const container = document.getElementById('quiz-container');
    const scoreDisplay = document.getElementById('current-score');

    questions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        const title = document.createElement('div');
        title.className = 'question-title';
        title.textContent = item.q;
        card.appendChild(title);

        const ul = document.createElement('ul');
        ul.className = 'options-list';

        item.options.forEach((opt, optIndex) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.textContent = opt;
            li.onclick = () => selectOption(index, optIndex, li);
            ul.appendChild(li);
        });

        card.appendChild(ul);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${index}`;
        card.appendChild(feedback);

        container.appendChild(card);
    });

    function selectOption(qIndex, selectedOptIndex, element) {
        const card = document.getElementById(`q-card-${qIndex}`);
        const options = card.querySelectorAll('.option-item');
        
        if (options[0].classList.contains('disabled')) return;

        options.forEach(opt => opt.classList.add('disabled'));

        const correctIndex = questions[qIndex].correct;
        const feedback = document.getElementById(`feedback-${qIndex}`);

        if (selectedOptIndex === correctIndex) {
            element.classList.add('correct');
            feedback.textContent = `¡Correcto! ${questions[qIndex].explanation}`;
            feedback.className = 'feedback show correct-feedback';
            score++;
            scoreDisplay.textContent = score;
        } else {
            element.classList.add('incorrect');
            options[correctIndex].classList.add('correct');
            feedback.textContent = `Incorrecto. La respuesta correcta era: "${questions[qIndex].options[correctIndex]}". Justificación: ${questions[qIndex].explanation}`;
            feedback.className = 'feedback show incorrect-feedback';
        }
    }
</script>
