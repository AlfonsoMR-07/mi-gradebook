        let currentFilter = 'all';
        let userAnswers = {}; 
        let timerSeconds = 0;
        let timerInterval = null;
        let quizActive = true;

        window.onload = function() {
            startTimer();
            renderQuestions();
        };

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!quizActive) return;
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? questionsData 
                : questionsData.filter(q => q.section === currentFilter);

            filtered.forEach((q, index) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                const selectedOption = userAnswers[q.id];
                const isCorrect = selectedOption === q.correct;

                const card = document.createElement('div');
                card.className = `question-card ${isAnswered ? (isCorrect ? 'correct' : 'incorrect') : ''}`;

                let imageHtml = '';
                if (q.image) {
                    imageHtml = `
                        <div class="q-image-container">
                            <img src="${q.image}" alt="Esquema anatómico de referencia para la pregunta ${q.id}" class="q-image" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'400\\' height=\\'150\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23f1f5f9\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' fill=\\'%2364748b\\' font-size=\\'14\\'>Coloca la imagen ${q.image} en la carpeta img/</text></svg>';">
                        </div>
                    `;
                }

                let optionsHtml = '';
                q.options.forEach(opt => {
                    let btnClass = "option-btn";
                    let badgeHtml = "";

                    if (isAnswered) {
                        if (opt.letter === q.correct) {
                            btnClass += " opt-correct";
                            badgeHtml = '<span class="badge-status badge-correct">✓ Correcta</span>';
                        } else if (opt.letter === selectedOption) {
                            btnClass += " opt-incorrect";
                            badgeHtml = '<span class="badge-status badge-incorrect">✗ Tu respuesta</span>';
                        } else {
                            btnClass += " opt-disabled";
                        }
                    }

                    optionsHtml += `
                        <button onclick="selectOption(${q.id}, '${opt.letter}')" ${isAnswered ? 'disabled' : ''} class="${btnClass}">
                            <span class="option-letter">${opt.letter}</span>
                            <span>${opt.text}</span>
                            ${badgeHtml}
                        </button>
                    `;
                });

                let feedbackHtml = '';
                if (isAnswered) {
                    feedbackHtml = `
                        <div class="feedback-box ${isCorrect ? 'correct' : 'incorrect'}">
                            <div class="feedback-title">${isCorrect ? '¡Excelente! Respuesta Correcta' : 'Respuesta Incorrecta'}</div>
                            <div><strong>Explicación:</strong> ${q.explanation}</div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="q-meta">
                        <span class="q-section">${q.sectionName}</span>
                        <span class="q-id">Pregunta ${index + 1} de ${filtered.length} (ID: ${q.id})</span>
                    </div>
                    <div class="q-text">${q.question}</div>
                    ${imageHtml}
                    <div class="options-list">${optionsHtml}</div>
                    ${feedbackHtml}
                `;

                container.appendChild(card);
            });

            updateScoreUI();
        }

        function selectOption(questionId, letter) {
            if (userAnswers[questionId] !== undefined) return;
            userAnswers[questionId] = letter;
            renderQuestions();
        }

        function updateScoreUI() {
            const totalAnswered = Object.keys(userAnswers).length;
            let correctCount = 0;
            
            for (const id in userAnswers) {
                const q = questionsData.find(item => item.id == id);
                if (q && userAnswers[id] === q.correct) {
                    correctCount++;
                }
            }

            document.getElementById('score-display').innerText = `${correctCount} / ${questionsData.length}`;
            
            if (totalAnswered === questionsData.length && quizActive) {
                quizActive = false;
                clearInterval(timerInterval);
                const summaryCard = document.getElementById('summary-card');
                const finalScore = document.getElementById('final-score');
                const summaryText = document.getElementById('summary-text');
                
                finalScore.innerText = `${correctCount} / ${questionsData.length} aciertos`;
                if (correctCount === questionsData.length) {
                    summaryText.innerText = "¡Impresionante! Tienes un dominio absoluto de la anatomía ósea de la columna y el cráneo.";
                } else if (correctCount >= 30) {
                    summaryText.innerText = "¡Excelente desempeño! Demuestras bases muy sólidas en anatomía.";
                } else {
                    summaryText.innerText = "Buen esfuerzo. Te recomendamos revisar los puntos con desaciertos para afianzar tus conocimientos.";
                }
                summaryCard.classList.remove('hidden');
                summaryCard.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function resetQuiz() {
            userAnswers = {};
            timerSeconds = 0;
            quizActive = true;
            document.getElementById('summary-card').classList.add('hidden');
            startTimer();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
