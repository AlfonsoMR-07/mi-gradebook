<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Interactivo: Anatomía Humana - Vértebras y Cráneo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; line-height: 1.5; padding-bottom: 40px; }
        header { background-color: #0f172a; color: white; padding: 20px 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
        .tag { background-color: #0284c7; color: #e0f2fe; font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
        p.subtitle { color: #cbd5e1; font-size: 0.875rem; }
        .stats { display: flex; align-items: center; gap: 16px; background-color: rgba(30, 41, 59, 0.9); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(51, 65, 85, 1); }
        .stat-box { text-align: center; }
        .stat-label { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-size: 1.25rem; font-weight: 700; font-family: monospace; color: #f8fafc; }
        .divider { width: 1px; height: 32px; background-color: #334155; }
        
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }
        .filter-card { background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .filter-title { font-weight: 600; font-size: 0.875rem; color: #334155; }
        .reset-btn { padding: 8px 16px; background-color: #f1f5f9; color: #334155; font-weight: 500; font-size: 0.875rem; border-radius: 12px; border: 1px solid #cbd5e1; cursor: pointer; transition: all 0.2s; }
        .reset-btn:hover { background-color: #e2e8f0; }
        
        .filter-grid { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; border: 1px solid #cbd5e1; background-color: #f8fafc; color: #475569; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { background-color: #f1f5f9; }
        .filter-btn.active { background-color: #0284c7; color: white; border-color: #0284c7; font-weight: 600; }
        
        .questions-list { display: flex; flex-direction: column; gap: 20px; }
        .question-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); transition: all 0.2s; display: flex; flex-direction: column; gap: 16px; }
        .question-card.correct { border-color: #6ee7b7; background-color: #f0fdf4; }
        .question-card.incorrect { border-color: #fca5a5; background-color: #fff1f2; }
        
        .q-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .q-section { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .q-id { font-size: 12px; color: #94a3b8; font-weight: 500; }
        .q-text { font-size: 1.05rem; font-weight: 600; color: #1e293b; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { width: 100%; text-align: left; padding: 12px 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; color: #334155; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.15s; }
        .option-btn:hover:not(:disabled) { background-color: #f8fafc; border-color: #cbd5e1; }
        .option-letter { width: 28px; height: 28px; border-radius: 8px; background-color: #f1f5f9; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; flex-shrink: 0; }
        
        .option-btn.opt-correct { border-color: #10b981; background-color: #ecfdf5; color: #065f46; font-weight: 600; }
        .option-btn.opt-incorrect { border-color: #f43f5e; background-color: #fff1f2; color: #9f1239; font-weight: 600; }
        .option-btn.opt-disabled { opacity: 0.6; }
        
        .feedback-box { padding: 14px 16px; border-radius: 12px; font-size: 0.875rem; border: 1px solid; margin-top: 4px; }
        .feedback-box.correct { background-color: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
        .feedback-box.incorrect { background-color: #fff1f2; border-color: #fecdd3; color: #9f1239; }
        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        
        .summary-card { background: linear-gradient(135deg, #0f172a, #0369a1); color: white; border-radius: 20px; padding: 32px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 16px; }
        .summary-card.hidden { display: none; }
        .trophy { font-size: 3rem; background: rgba(255,255,255,0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .final-score { font-size: 2rem; font-weight: 800; background: rgba(255,255,255,0.2); padding: 8px 24px; border-radius: 16px; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div>
                <span class="tag">Evaluación Oficial</span>
                <h1>Anatomía Humana: Vértebras y Cráneo</h1>
                <p class="subtitle">Banco interactivo de preguntas (150 reactivos)</p>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">Tiempo</span>
                    <span id="timer" class="stat-val">00:00</span>
                </div>
                <div class="divider"></div>
                <div class="stat-box">
                    <span class="stat-label">Puntaje</span>
                    <span id="score-display" class="stat-val">0 / 150</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="filter-card">
            <div class="filter-header">
                <span class="filter-title">🔍 Filtrar por Bloque Temático:</span>
                <button onclick="resetQuiz()" class="reset-btn">🔄 Reiniciar Examen</button>
            </div>
            <div class="filter-grid" id="filter-container">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn active">Todos (150)</button>
                <button onclick="setFilter('b1')" id="filter-b1" class="filter-btn">Bloque I: Vértebras</button>
                <button onclick="setFilter('b2')" id="filter-b2" class="filter-btn">Bloque II: Cráneo</button>
                <button onclick="setFilter('b3')" id="filter-b3" class="filter-btn">Bloque III: Craniometría</button>
                <button onclick="setFilter('b4')" id="filter-b4" class="filter-btn">Bloque IV: Simulacro Visual</button>
            </div>
        </div>

        <div id="questions-container" class="questions-list"></div>

        <div id="summary-card" class="summary-card hidden">
            <div class="trophy">🏆</div>
            <h2>¡Examen Finalizado!</h2>
            <p id="summary-text" style="color: #cbd5e1; max-width: 500px;">Has completado el banco de preguntas seleccionado.</p>
            <div class="final-score" id="final-score">0 / 150 aciertos</div>
            <button onclick="resetQuiz()" class="reset-btn" style="background: white; color: #0f172a; font-weight: 700; padding: 12px 24px; font-size: 1rem;">
                Reiniciar Examen
            </button>
        </div>
    </main>

    <script>
        const questionsData = [
            // BLOQUE I: Vértebras (1 al 33)
            { id: 1, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una imagen de una vértebra típica, la flecha señala la porción ósea situada anteriormente, con forma aproximadamente cilíndrica. ¿Qué estructura es?', options: [{letter:'A', text:'Lámina vertebral'}, {letter:'B', text:'Cuerpo vertebral'}, {letter:'C', text:'Pedículo'}, {letter:'D', text:'Apófisis espinosa'}], correct: 'B' },
            { id: 2, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala el espacio situado entre la cara posterior del cuerpo vertebral y la apófisis espinosa. ¿Qué estructura es?', options: [{letter:'A', text:'Agujero transverso'}, {letter:'B', text:'Agujero de conjunción'}, {letter:'C', text:'Agujero vertebral'}, {letter:'D', text:'Conducto vertebral intervertebral'}], correct: 'C' },
            { id: 3, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una vista posterior, ¿qué estructura impar y media se proyecta hacia atrás?', options: [{letter:'A', text:'Apófisis espinosa'}, {letter:'B', text:'Apófisis transversa'}, {letter:'C', text:'Pedículo'}, {letter:'D', text:'Lámina'}], correct: 'A' },
            { id: 4, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala una de las dos prolongaciones óseas que se dirigen transversalmente hacia fuera. ¿Qué estructura es?', options: [{letter:'A', text:'Apófisis articular superior'}, {letter:'B', text:'Apófisis espinosa'}, {letter:'C', text:'Cuerpo vertebral'}, {letter:'D', text:'Apófisis transversa'}], correct: 'D' },
            { id: 5, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué estructuras vertebrales presentan cuatro eminencias destinadas a articular las vértebras entre sí?', options: [{letter:'A', text:'Pedículos'}, {letter:'B', text:'Apófisis articulares'}, {letter:'C', text:'Láminas'}, {letter:'D', text:'Apófisis transversas'}], correct: 'B' },
            { id: 6, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una imagen posterior, la flecha señala una estructura aplanada y cuadrilátera que forma parte de la pared posterolateral del agujero raquídeo. ¿Cuál es?', options: [{letter:'A', text:'Cuerpo vertebral'}, {letter:'B', text:'Pedículo'}, {letter:'C', text:'Lámina vertebral'}, {letter:'D', text:'Apófisis transversa'}], correct: 'C' },
            { id: 7, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala las porciones óseas delgadas que unen la parte posterior y lateral del cuerpo vertebral con la base de las apófisis. ¿Cuáles son?', options: [{letter:'A', text:'Pedículos'}, {letter:'B', text:'Láminas'}, {letter:'C', text:'Apófisis espinosas'}, {letter:'D', text:'Apófisis articulares'}], correct: 'A' },
            { id: 8, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué estructura se forma al superponerse las escotaduras de los pedículos de vértebras vecinas y permite la salida de los nervios raquídeos?', options: [{letter:'A', text:'Agujero vertebral'}, {letter:'B', text:'Agujero transverso'}, {letter:'C', text:'Conducto central'}, {letter:'D', text:'Agujero de conjunción'}], correct: 'D' },
            { id: 9, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una vista superior, ¿qué estructura está delimitada anteriormente por el cuerpo vertebral y posteriormente por el arco vertebral?', options: [{letter:'A', text:'Agujero de conjunción'}, {letter:'B', text:'Agujero vertebral'}, {letter:'C', text:'Agujero transverso'}, {letter:'D', text:'Conducto carotídeo'}], correct: 'B' },
            { id: 10, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Cuál es la característica descrita para las caras superior e inferior del cuerpo vertebral?', options: [{letter:'A', text:'Son fuertemente convexas y rugosas.'}, {letter:'B', text:'Presentan una gran apófisis central.'}, {letter:'C', text:'Son planas y horizontales, con una zona central perforada rodeada por tejido compacto.'}, {letter:'D', text:'Son cóncavas y presentan un agujero transverso.'}], correct: 'C' },
            { id: 11, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala un agujero en la base de una apófisis transversa. La vértebra tiene además una apófisis espinosa corta y frecuentemente bifurcada. ¿A qué región pertenece?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Dorsal'}, {letter:'C', text:'Lumbar'}, {letter:'D', text:'Sacra'}], correct: 'A' },
            { id: 12, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué región vertebral presenta un cuerpo con semicarillas articulares para la cabeza de las costillas?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Lumbar'}, {letter:'C', text:'Coxígea'}, {letter:'D', text:'Dorsal'}], correct: 'D' },
            { id: 13, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'Una vértebra tiene un cuerpo voluminoso, diámetro transversal mayor que el anteroposterior y apófisis transversas costiformes. ¿Cuál es?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Lumbar'}, {letter:'C', text:'Dorsal'}, {letter:'D', text:'Atlas'}], correct: 'B' },
            { id: 14, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una imagen lateral, la flecha señala una apófisis espinosa muy larga, prismática, triangular y fuertemente inclinada hacia atrás. ¿Qué región estás observando?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Lumbar'}, {letter:'C', text:'Dorsal'}, {letter:'D', text:'Atlas'}], correct: 'C' },
            { id: 15, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿En qué región es característico un agujero vertebral triangular de base anterior, junto con apófisis espinosas cortas y bifurcadas?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Dorsal'}, {letter:'C', text:'Lumbar'}, {letter:'D', text:'Coxígea'}], correct: 'A' },
            { id: 16, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Cuál es la forma característica del agujero vertebral de las vértebras dorsales según la presentación?', options: [{letter:'A', text:'Triangular de base anterior'}, {letter:'B', text:'Cuadrangular'}, {letter:'C', text:'Triangular de lados casi iguales'}, {letter:'D', text:'Relativamente pequeño e irregularmente circular'}], correct: 'D' },
            { id: 17, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué región presenta láminas más anchas que altas?', options: [{letter:'A', text:'Lumbar'}, {letter:'B', text:'Cervical'}, {letter:'C', text:'Dorsal'}, {letter:'D', text:'Sacra'}], correct: 'B' },
            { id: 18, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala una carilla articular en la cara anterior de una apófisis transversa, destinada a la tuberosidad de una costilla. ¿En qué región se encuentra?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Lumbar'}, {letter:'C', text:'Dorsal'}, {letter:'D', text:'Coxígea'}], correct: 'C' },
            { id: 19, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué región tiene apófisis articulares superiores en forma de canales, dirigidas hacia atrás y adentro, con un tubérculo mamilar?', options: [{letter:'A', text:'Lumbar'}, {letter:'B', text:'Cervical'}, {letter:'C', text:'Dorsal'}, {letter:'D', text:'Atlas'}], correct: 'A' },
            { id: 20, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿En qué región las apófisis transversas nacen detrás del pedículo y presentan una carilla para la tuberosidad costal?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Lumbar'}, {letter:'C', text:'Sacra'}, {letter:'D', text:'Dorsal'}], correct: 'D' },
            { id: 21, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala los ganchos o apófisis semilunares de la parte superior del cuerpo vertebral. ¿A qué región corresponden?', options: [{letter:'A', text:'Lumbar'}, {letter:'B', text:'Cervical'}, {letter:'C', text:'Dorsal'}, {letter:'D', text:'Coxígea'}], correct: 'B' },
            { id: 22, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué característica de los pedículos describe la presentación para las vértebras lumbares?', options: [{letter:'A', text:'La escotadura superior es mucho más profunda.'}, {letter:'B', text:'Ambas escotaduras tienen exactamente la misma profundidad.'}, {letter:'C', text:'Las escotaduras inferiores son tres o cuatro veces mayores que las superiores.'}, {letter:'D', text:'No presentan escotaduras.'}], correct: 'C' },
            { id: 23, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una vértebra, las apófisis articulares superiores miran atrás y arriba, mientras las inferiores miran delante y abajo. ¿Qué región es?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Dorsal'}, {letter:'C', text:'Lumbar'}, {letter:'D', text:'Atlas'}], correct: 'A' },
            { id: 24, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué región presenta un cuerpo vertebral con diámetro transversal mayor que el anteroposterior?', options: [{letter:'A', text:'Cervical'}, {letter:'B', text:'Dorsal'}, {letter:'C', text:'Atlas'}, {letter:'D', text:'Lumbar'}], correct: 'D' },
            { id: 25, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala la primera vértebra cervical, formada por masas laterales unidas por dos arcos. ¿Cuál es?', options: [{letter:'A', text:'Axis'}, {letter:'B', text:'Atlas'}, {letter:'C', text:'C7'}, {letter:'D', text:'T1'}], correct: 'B' },
            { id: 26, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué estructura está ausente en el atlas?', options: [{letter:'A', text:'Masas laterales'}, {letter:'B', text:'Arco anterior'}, {letter:'C', text:'Cuerpo vertebral típico'}, {letter:'D', text:'Arco posterior'}], correct: 'C' },
            { id: 27, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En una vista superior del atlas, la flecha señala las superficies articulares elipsoidales que se articulan con los cóndilos del occipital. ¿Qué estructura es?', options: [{letter:'A', text:'Cavidades glenoideas de las masas laterales'}, {letter:'B', text:'Tubérculos posteriores'}, {letter:'C', text:'Apófisis transversas'}, {letter:'D', text:'Carillas inferiores para el axis'}], correct: 'A' },
            { id: 28, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué estructura se observa en la parte anterior del arco anterior del atlas?', options: [{letter:'A', text:'Tubérculo posterior'}, {letter:'B', text:'Apófisis odontoides'}, {letter:'C', text:'Canal de la arteria vertebral'}, {letter:'D', text:'Tubérculo anterior'}], correct: 'D' },
            { id: 29, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'La flecha señala una carilla oval situada en la cara posterior del arco anterior del atlas. ¿Con qué estructura se articula?', options: [{letter:'A', text:'Cóndilo occipital'}, {letter:'B', text:'Apófisis odontoides del axis'}, {letter:'C', text:'Cuerpo de C3'}, {letter:'D', text:'Apófisis espinosa de C7'}], correct: 'B' },
            { id: 30, block: 'b1', blockName: 'Bloque I - Vértebras', question: 'En la línea media posterior del atlas, ¿qué estructura sustituye morfológicamente a la apófisis espinosa típica?', options: [{letter:'A', text:'Tubérculo anterior'}, {letter:'B', text:'Cavidad glenoidea'}, {letter:'C', text:'Tubérculo posterior'}, {letter:'D', text:'Apófisis odontoides'}], correct: 'C' },
            { id: 31, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué estructura pasa por un canal situado en la cara superior de la extremidad externa del arco posterior del atlas?', options: [{letter:'A', text:'Arteria vertebral'}, {letter:'B', text:'Arteria carótida externa'}, {letter:'C', text:'Nervio óptico'}, {letter:'D', text:'Vena yugular interna'}], correct: 'A' },
            { id: 32, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Qué estructura se inserta en la cara interna rugosa de las masas laterales del atlas?', options: [{letter:'A', text:'Ligamento longitudinal anterior'}, {letter:'B', text:'Ligamento amarillo'}, {letter:'C', text:'Ligamento nucal'}, {letter:'D', text:'Ligamento transverso'}], correct: 'D' },
            { id: 33, block: 'b1', blockName: 'Bloque I - Vértebras', question: '¿Cuál es la relación articular de la cara inferior de las masas laterales del atlas?', options: [{letter:'A', text:'Se articula con el occipital.'}, {letter:'B', text:'Presenta una carilla plana o algo cóncava para el axis.'}, {letter:'C', text:'Se articula con las costillas.'}, {letter:'D', text:'Se articula con el esfenoides.'}], correct: 'B' },

            // BLOQUE II: Cráneo descriptivo (34 al 100)
            { id: 34, block: 'b2', blockName: 'Bloque II - Cráneo', question: '¿Cuál es la función principal del cráneo descrita en la presentación?', options: [{letter:'A', text:'Producir células sanguíneas exclusivamente.'}, {letter:'B', text:'Permitir el movimiento de las costillas.'}, {letter:'C', text:'Alojar y proteger el encéfalo.'}, {letter:'D', text:'Formar la cavidad abdominal.'}], correct: 'C' },
            { id: 35, block: 'b2', blockName: 'Bloque II - Cráneo', question: 'Según la presentación, ¿cuántos huesos forman el cráneo estudiado y cómo se clasifican?', options: [{letter:'A', text:'Ocho huesos: cuatro pares y cuatro impares.'}, {letter:'B', text:'Ocho huesos: seis pares y dos impares.'}, {letter:'C', text:'Siete huesos: tres pares y cuatro impares.'}, {letter:'D', text:'Diez huesos: cinco pares.'}], correct: 'A' },
            { id: 36, block: 'b2', blockName: 'Bloque II - Cráneo', question: '¿Cuál de los siguientes grupos contiene únicamente huesos impares de la lista presentada?', options: [{letter:'A', text:'Parietal, temporal, frontal y occipital.'}, {letter:'B', text:'Parietal, esfenoides, etmoides y temporal.'}, {letter:'C', text:'Temporal, frontal, etmoides y parietal.'}, {letter:'D', text:'Frontal, etmoides, esfenoides y occipital.'}], correct: 'D' },
            { id: 37, block: 'b2', blockName: 'Bloque II - Cráneo', question: 'La flecha señala el hueso que ocupa la parte más anterior del cráneo. ¿Cuál es?', options: [{letter:'A', text:'Occipital'}, {letter:'B', text:'Frontal'}, {letter:'C', text:'Parietal'}, {letter:'D', text:'Temporal'}], correct: 'B' },
            { id: 38, block: 'b2', blockName: 'Bloque II - Cráneo', question: '¿Cuántas caras principales describe la presentación para el hueso frontal?', options: [{letter:'A', text:'Dos'}, {letter:'B', text:'Cuatro'}, {letter:'C', text:'Tres'}, {letter:'D', text:'Seis'}], correct: 'C' },
            { id: 39, block: 'b2', blockName: 'Bloque II - Cráneo', question: '¿Cómo se caracteriza la cara anterior del frontal?', options: [{letter:'A', text:'Convexa y lisa'}, {letter:'B', text:'Cóncava y rugosa'}, {letter:'C', text:'Plana y perforada'}, {letter:'D', text:'Triangular y profundamente excavada'}], correct: 'A' },
            { id: 40, block: 'b2', blockName: 'Bloque II - Cráneo', question: 'La flecha señala el punto medio situado por encima de la raíz de la nariz, en la región frontal. ¿Qué estructura es?', options: [{letter:'A', text:'Nasion'}, {letter:'B', text:'Bregma'}, {letter:'C', text:'Acanthion'}, {letter:'D', text:'Glabela'}], correct: 'D' },

            { id: 135, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'La flecha señala una pequeña escotadura que, junto con la de una vértebra adyacente, forma una abertura lateral por donde sale un nervio raquídeo. ¿Qué estructura es?', options: [{letter:'A', text:'Agujero transverso'}, {letter:'B', text:'Escotadura vertebral del pedículo'}, {letter:'C', text:'Agujero magno'}, {letter:'D', text:'Lámina vertebral'}], correct: 'B' },
            { id: 136, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: '¿Cuál de las siguientes combinaciones permite identificar con mayor seguridad una vértebra dorsal?', options: [{letter:'A', text:'Agujero transverso y apófisis espinosa bífida.'}, {letter:'B', text:'Cuerpo voluminoso y apófisis transversas costiformes.'}, {letter:'C', text:'Ausencia de cuerpo y dos arcos.'}, {letter:'D', text:'Semicarillas costales en el cuerpo y apófisis espinosa larga e inclinada.'}], correct: 'D' },
            { id: 137, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En una vista inferior del cráneo, la flecha señala el gran agujero del hueso occipital. ¿Cuál es?', options: [{letter:'A', text:'Foramen magno'}, {letter:'B', text:'Agujero oval'}, {letter:'C', text:'Agujero redondo mayor'}, {letter:'D', text:'Agujero óptico'}], correct: 'A' },
            { id: 138, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'La flecha señala una gran depresión en la cara superior del cuerpo del esfenoides, situada entre las apófisis clinoides. ¿Cuál es?', options: [{letter:'A', text:'Fosa pterigoidea'}, {letter:'B', text:'Fosa parietal'}, {letter:'C', text:'Silla turca'}, {letter:'D', text:'Fosita lagrimal'}], correct: 'C' },
            { id: 139, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En una vista superior de la cavidad nasal, la flecha señala una lámina ósea media que forma parte del tabique nasal y pertenece al etmoides. ¿Cuál es?', options: [{letter:'A', text:'Lámina cribosa'}, {letter:'B', text:'Lámina perpendicular'}, {letter:'C', text:'Ala mayor'}, {letter:'D', text:'Apófisis unciforme'}], correct: 'B' },
            { id: 140, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En la región superior de la cavidad nasal, la flecha señala una lámina perforada por numerosos orificios olfatorios. ¿Cuál es?', options: [{letter:'A', text:'Lámina perpendicular'}, {letter:'B', text:'Lámina cuadrilátera del esfenoides'}, {letter:'C', text:'Lámina pterigoidea'}, {letter:'D', text:'Lámina cribosa'}], correct: 'D' },
            { id: 141, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En una vista lateral del cráneo, la flecha señala la prominencia situada detrás e inferior al conducto auditivo externo. ¿Cuál es?', options: [{letter:'A', text:'Apófisis mastoides'}, {letter:'B', text:'Apófisis estiloides'}, {letter:'C', text:'Apófisis pterigoides'}, {letter:'D', text:'Apófisis clinoides'}], correct: 'A' },
            { id: 142, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'La flecha señala una prolongación delgada y puntiaguda que desciende desde el temporal. ¿Cuál es?', options: [{letter:'A', text:'Apófisis mastoides'}, {letter:'B', text:'Apófisis cigomática'}, {letter:'C', text:'Apófisis estiloides'}, {letter:'D', text:'Apófisis unciforme'}], correct: 'C' },
            { id: 143, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En una vista lateral del cráneo, la flecha señala el punto donde confluyen cuatro huesos: frontal, parietal, ala mayor del esfenoides y temporal. ¿Cuál es?', options: [{letter:'A', text:'Asterion'}, {letter:'B', text:'Pterion'}, {letter:'C', text:'Lambda'}, {letter:'D', text:'Bregma'}], correct: 'B' },
            { id: 144, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'La flecha señala la unión entre la sutura coronal y la sagital, en la región superior del cráneo. ¿Cuál es?', options: [{letter:'A', text:'Lambda'}, {letter:'B', text:'Inion'}, {letter:'C', text:'Nasion'}, {letter:'D', text:'Bregma'}], correct: 'D' },
            { id: 145, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En una vista posterior del cráneo, la flecha señala la unión de las suturas sagital y lambdoidea. ¿Cuál es?', options: [{letter:'A', text:'Lambda'}, {letter:'B', text:'Bregma'}, {letter:'C', text:'Pterion'}, {letter:'D', text:'Dacryon'}], correct: 'A' },
            { id: 146, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'La flecha señala una abertura de la base del cráneo situada en el ala mayor del esfenoides, detrás del agujero redondo mayor y antes del redondo menor en el orden de la presentación. ¿Cuál es?', options: [{letter:'A', text:'Agujero óptico'}, {letter:'B', text:'Agujero de Vesalio'}, {letter:'C', text:'Agujero oval'}, {letter:'D', text:'Agujero condíleo anterior'}], correct: 'C' },
            { id: 147, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'La flecha señala la superficie articular ovalada del occipital que se relaciona con el atlas. ¿Cuál es?', options: [{letter:'A', text:'Apófisis mastoides'}, {letter:'B', text:'Cóndilo del occipital'}, {letter:'C', text:'Ala menor del esfenoides'}, {letter:'D', text:'Eminencia parietal'}], correct: 'B' },
            { id: 148, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En la cara externa del parietal, la flecha señala una prominencia redondeada cerca de la parte media del hueso. ¿Cuál es?', options: [{letter:'A', text:'Glabela'}, {letter:'B', text:'Protuberancia occipital externa'}, {letter:'C', text:'Eminencia frontal lateral'}, {letter:'D', text:'Eminencia parietal'}], correct: 'D' },
            { id: 149, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En la cara posterior del frontal, la flecha señala una cresta media vertical relacionada con la inserción de la hoz del cerebro. ¿Cuál es?', options: [{letter:'A', text:'Cresta frontal'}, {letter:'B', text:'Cresta occipital externa'}, {letter:'C', text:'Cresta esfenotemporal'}, {letter:'D', text:'Línea temporal superior'}], correct: 'A' },
            { id: 150, block: 'b4', blockName: 'Bloque IV - Simulacro Visual', question: 'En la cara externa del occipital, la flecha señala una prominencia media situada por encima de la cresta occipital externa. ¿Cuál es?', options: [{letter:'A', text:'Protuberancia occipital interna'}, {letter:'B', text:'Eminencia parietal'}, {letter:'C', text:'Protuberancia occipital externa'}, {letter:'D', text:'Glabela'}], correct: 'C' }
        ];

        let currentFilter = 'all';
        let userAnswers = {};
        let score = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let quizActive = true;

        function initQuiz() {
            startTimer();
            renderQuestions();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (!quizActive) return;
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function setFilter(block) {
            currentFilter = block;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${block}`).classList.add('active');
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? questionsData 
                : questionsData.filter(q => q.block === currentFilter);

            filtered.forEach((q) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${q.id}`;

                if (userAnswers[q.id]) {
                    card.classList.add(userAnswers[q.id].isCorrect ? 'correct' : 'incorrect');
                }

                const meta = document.createElement('div');
                meta.className = 'q-meta';
                meta.innerHTML = `
                    <span class="q-section">${q.blockName}</span>
                    <span class="q-id">Pregunta ${q.id} de 150</span>
                `;
                card.appendChild(meta);

                const text = document.createElement('div');
                text.className = 'q-text';
                text.textContent = q.question;
                card.appendChild(text);

                const optionsList = document.createElement('div');
                optionsList.className = 'options-list';

                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = `q${q.id}-opt-${opt.letter}`;
                    
                    const isAnswered = userAnswers[q.id] !== undefined;
                    if (isAnswered) {
                        btn.disabled = true;
                        btn.classList.add('opt-disabled');
                        if (opt.letter === q.correct) {
                            btn.classList.add('opt-correct');
                        } else if (opt.letter === userAnswers[q.id].selected) {
                            btn.classList.add('opt-incorrect');
                        }
                    }

                    btn.innerHTML = `
                        <span class="option-letter">${opt.letter}</span>
                        <span>${opt.text}</span>
                    `;

                    if (!isAnswered) {
                        btn.onclick = () => handleAnswer(q.id, opt.letter);
                    }

                    optionsList.appendChild(btn);
                });

                card.appendChild(optionsList);

                if (userAnswers[q.id]) {
                    const feedback = document.createElement('div');
                    const isCorr = userAnswers[q.id].isCorrect;
                    feedback.className = `feedback-box ${isCorr ? 'correct' : 'incorrect'}`;
                    feedback.innerHTML = `
                        <div class="feedback-title">${isCorr ? '✅ ¡Respuesta Correcta!' : '❌ Respuesta Incorrecta'}</div>
                        <div>La opción correcta es la letra <strong>${q.correct}</strong>.</div>
                    `;
                    card.appendChild(feedback);
                }

                container.appendChild(card);
            });
        }

        function handleAnswer(questionId, selectedLetter) {
            if (userAnswers[questionId] !== undefined) return;

            const question = questionsData.find(q => q.id === questionId);
            const isCorrect = selectedLetter === question.correct;

            userAnswers[questionId] = { selected: selectedLetter, isCorrect };

            if (isCorrect) {
                score++;
                updateScoreDisplay();
            }

            renderQuestions();
            checkCompletion();
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = `${score} / 150`;
        }

        function checkCompletion() {
            if (Object.keys(userAnswers).length === questionsData.length) {
                quizActive = false;
                const summaryCard = document.getElementById('summary-card');
                const finalScore = document.getElementById('final-score');
                const summaryText = document.getElementById('summary-text');
                
                finalScore.textContent = `${score} / 150 aciertos`;
                summaryText.textContent = `Has completado todo el banco de preguntas de anatomía con un puntaje final de ${score}.`;
                summaryCard.classList.remove('hidden');
                summaryCard.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function resetQuiz() {
            userAnswers = {};
            score = 0;
            secondsElapsed = 0;
            quizActive = true;
            updateScoreDisplay();
            document.getElementById('summary-card').classList.add('hidden');
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = initQuiz;
    </script>
</body>
