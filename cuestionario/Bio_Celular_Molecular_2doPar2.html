    <script>
        const questionsData = [
            // EQUIPO 1
            {
                id: 1, team: 'eq1', teamName: 'Equipo 1 - Citoesqueleto',
                question: 'Una célula sometida a cambios constantes de forma necesita reorganizar sus estructuras internas sin perder la distribución adecuada de sus orgánulos. ¿Qué propiedad del citoesqueleto permite responder a estas necesidades?',
                options: [
                    { letter: 'A', text: 'La estabilidad permanente de sus filamentos, que impide cualquier modificación estructural.' },
                    { letter: 'B', text: 'La capacidad de sus componentes para ensamblarse y desensamblarse de manera regulada, adaptando la arquitectura celular.' },
                    { letter: 'C', text: 'La sustitución de sus proteínas estructurales por lípidos de membrana durante los cambios de forma.' },
                    { letter: 'D', text: 'La formación de una cubierta continua que separa el citoplasma de los compartimentos membranosos.' }
                ],
                correct: 'B', explanation: 'El dinamismo del citoesqueleto permite el ensamblaje y desensamblaje regulado de sus filamentos para adaptar la arquitectura celular[cite: 42].'
            },
            {
                id: 2, team: 'eq1', teamName: 'Equipo 1 - Microtúbulos',
                question: 'Durante el funcionamiento de un cilio móvil, una alteración impide que los dobletes de microtúbulos se deslicen entre sí de manera coordinada. ¿Qué proteína sería la más directamente relacionada con este defecto?',
                options: [
                    { letter: 'A', text: 'Cinesina, debido a su función en la formación de filamentos intermedios.' },
                    { letter: 'B', text: 'Queratina, debido a su capacidad para estabilizar el axonema mediante enlaces cruzados.' },
                    { letter: 'C', text: 'Dineína axonemal, debido a su actividad motora dependiente de ATP sobre los microtúbulos.' },
                    { letter: 'D', text: 'Fimbrina, debido a su función en la organización de los microfilamentos de actina.' }
                ],
                correct: 'C', explanation: 'La dineína axonemal es la proteína motora que genera el deslizamiento de los microtúbulos en cilios y flagelos empleando ATP[cite: 42].'
            },
            {
                id: 3, team: 'eq1', teamName: 'Equipo 1 - Filamentos intermedios, actina y miosina',
                question: 'Durante la división de una célula animal, se observa que el núcleo se divide correctamente, pero la célula no consigue separar por completo su citoplasma. ¿Qué alteración explicaría mejor este resultado?',
                options: [
                    { letter: 'A', text: 'Una disminución en la interacción entre actina y miosina II en el anillo contráctil.' },
                    { letter: 'B', text: 'Una pérdida de queratina que impide la duplicación de los cromosomas.' },
                    { letter: 'C', text: 'Una reducción de los neurofilamentos que bloquea la síntesis de ATP.' },
                    { letter: 'D', text: 'Una alteración de la tubulina que impide directamente la formación de los puentes cruzados musculares.' }
                ],
                correct: 'A', explanation: 'La citocinesis depende de la contracción del anillo periférico compuesto por actina y miosina II[cite: 42].'
            },
            {
                id: 4, team: 'eq1', teamName: 'Equipo 1 - Contracción muscular',
                question: 'En una fibra muscular esquelética, el retículo sarcoplásmico libera calcio y posteriormente debe recuperar el estado de reposo. ¿Qué mecanismo permite principalmente que disminuya la concentración de calcio en el citoplasma?',
                options: [
                    { letter: 'A', text: 'La unión irreversible del calcio a la actina, que bloquea permanentemente sus sitios de interacción.' },
                    { letter: 'B', text: 'La difusión del calcio hacia el exterior de la fibra a través de los canales de sodio.' },
                    { letter: 'C', text: 'La degradación de la troponina, que elimina el calcio libre del citoplasma.' },
                    { letter: 'D', text: 'El transporte activo del calcio de regreso al retículo sarcoplásmico mediante bombas SERCA, con gasto de ATP.' }

                correct: 'D', explanation: 'Las bombas SERCA devueven el calcio al interior del retículo sarcoplásmico mediante transporte activo impulsado por ATP[cite: 42].'
            },
            {
                id: 5, team: 'eq1', teamName: 'Equipo 1 - Motilidad y espacio extracelular',

                    { letter: 'A', text: 'Filopodios, cuya función principal es generar cilios mediante el deslizamiento de microtúbulos.' },
                    { letter: 'B', text: 'Invadopodios, que participan en la degradación localizada de la matriz extracelular.' },
                    { letter: 'C', text: 'Microvellosidades, especializadas en la digestión extracelular mediante contracción de miosina II.' },
                    { letter: 'D', text: 'Desmosomas, que degradan la matriz para permitir el desplazamiento de células vecinas.' }

            {

                options: [
                    { letter: 'A', text: 'Elastina, debido a que forma una red especializada en absorber grandes cantidades de agua.' },
                    { letter: 'B', text: 'Fibronectina, debido a que constituye el principal componente contráctil del cartílago.' },

            {

                correct: 'D', explanation: 'La mecanotransducción transmite la información física y de rigidez del sustrato al interior a través de complejos de adhesión y citoesqueleto[cite: 42].'

            {

                    { letter: 'D', text: 'Tubulinas, que forman los filamentos de adhesión de la membrana plasmática.' }
                ],
                correct: 'A', explanation: 'Las cadherinas son moléculas de adhesión homofílica dependientes de Ca²⁺ que se conectan con la actina[cite: 42].'
            },
            {
                id: 9, team: 'eq1', teamName: 'Equipo 1 - Uniones especializadas',
                question: 'En un tejido cardíaco, una alteración impide el paso coordinado de iones entre cardiomiocitos vecinos, aunque las células continúan en contacto físico. ¿Qué estructura celular está más directamente relacionada con este problema?',

                    { letter: 'C', text: 'Uniones comunicantes, formadas por canales que permiten el paso de iones y pequeñas moléculas entre células adyacentes.' },
                    { letter: 'D', text: 'Hemidesmosomas, que fijan las células a la lámina basal mediante conexiones con filamentos intermedios.' }

                correct: 'C', explanation: 'Las uniones comunicantes o gap junctions permiten el acoplamiento iónico directo entre células vecinas[cite: 42].'
            },
            {
                id: 10, team: 'eq1', teamName: 'Equipo 1 - Sistema de endomembranas',

            },
