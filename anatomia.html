<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario Interactivo de Anatomía (70 Preguntas)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; line-height: 1.5; padding-bottom: 40px; }
        header { background-color: #0284c7; color: white; padding: 20px 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
        .tag { background-color: #0369a1; color: #e0f2fe; font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
        p.subtitle { color: #bae6fd; font-size: 0.875rem; }
        .stats { display: flex; align-items: center; gap: 16px; background-color: rgba(3, 105, 161, 0.8); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.5); }
        .stat-box { text-align: center; }
        .stat-label { display: block; font-size: 11px; color: #bae6fd; text-transform: uppercase; }
        .stat-val { font-size: 1.25rem; font-weight: 700; font-family: monospace; }
        .divider { width: 1px; height: 32px; background-color: #0284c7; }
        
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }
        .filter-card { background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .filter-title { font-weight: 600; font-size: 0.875rem; color: #334155; }
        .reset-btn { padding: 8px 16px; background-color: #f1f5f9; color: #334155; font-weight: 500; font-size: 0.875rem; border-radius: 12px; border: 1px solid #cbd5e1; cursor: pointer; transition: all 0.2s; }
        .reset-btn:hover { background-color: #e2e8f0; }
        
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .filter-btn { padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 500; border: 1px solid #cbd5e1; background-color: #f8fafc; color: #475569; cursor: pointer; text-align: center; transition: all 0.2s; }
        .filter-btn:hover { background-color: #f1f5f9; }
        .filter-btn.active { background-color: #0284c7; color: white; border-color: #0284c7; font-weight: 600; }
        
        .questions-list { display: flex; flex-direction: column; gap: 20px; }
        .question-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); transition: all 0.2s; display: flex; flex-direction: column; gap: 16px; }
        .question-card.correct { border-color: #6ee7b7; background-color: #f0fdf4; }
        .question-card.incorrect { border-color: #fca5a5; background-color: #fff1f2; }
        
        .q-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .q-team { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .q-id { font-size: 12px; color: #94a3b8; font-weight: 500; }
        .q-text { font-size: 1.05rem; font-weight: 600; color: #1e293b; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { width: 100%; text-align: left; padding: 12px 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; color: #334155; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.15s; }
        .option-btn:hover:not(:disabled) { background-color: #f8fafc; border-color: #cbd5e1; }
        .option-letter { width: 28px; height: 28px; border-radius: 8px; background-color: #f1f5f9; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; shrink: 0; }
        
        .option-btn.opt-correct { border-color: #10b981; background-color: #ecfdf5; color: #065f46; font-weight: 600; }
        .option-btn.opt-incorrect { border-color: #f43f5e; background-color: #fff1f2; color: #9f1239; font-weight: 600; }
        .option-btn.opt-disabled { opacity: 0.6; }
        
        .badge-status { margin-left: auto; font-size: 0.75rem; font-weight: 700; }
        .badge-correct { color: #059669; }
        .badge-incorrect { color: #e11d48; }
        
        .feedback-box { padding: 14px 16px; border-radius: 12px; font-size: 0.875rem; border: 1px solid; margin-top: 4px; }
        .feedback-box.correct { background-color: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
        .feedback-box.incorrect { background-color: #fff1f2; border-color: #fecdd3; color: #9f1239; }
        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        
        .summary-card { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border-radius: 20px; padding: 32px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 16px; }
        .summary-card.hidden { display: none; }
        .trophy { font-size: 3rem; background: rgba(255,255,255,0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .final-score { font-size: 2rem; font-weight: 800; background: rgba(255,255,255,0.2); padding: 8px 24px; border-radius: 16px; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div>
                <span class="tag">Repaso Académico de Anatomía</span>
                <h1>Examen Interactivo de Anatomía Humana</h1>
                <p class="subtitle">Evaluación interactiva con 70 preguntas de opción múltiple</p>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">Tiempo</span>
                    <span id="timer" class="stat-val">00:00</span>
                </div>
                <div class="divider"></div>
                <div class="stat-box">
                    <span class="stat-label">Puntaje</span>
                    <span id="score-display" class="stat-val">0 / 70</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="filter-card">
            <div class="filter-header">
                <span class="filter-title">🔍 Filtrar por Tema:</span>
                <button onclick="resetQuiz()" class="reset-btn">🔄 Reiniciar Cuestionario</button>
            </div>
            <div class="filter-grid" id="filter-container">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn active">Todos (70)</button>
                <button onclick="setFilter('t1')" id="filter-t1" class="filter-btn">Posición y Planos (10)</button>
                <button onclick="setFilter('t2')" id="filter-t2" class="filter-btn">Movimientos (14)</button>
                <button onclick="setFilter('t3')" id="filter-t3" class="filter-btn">Fascias y Membranas (11)</button>
                <button onclick="setFilter('t4')" id="filter-t4" class="filter-btn">Variantes Anatómicas (5)</button>
                <button onclick="setFilter('t5')" id="filter-t5" class="filter-btn">Sistema Tegumentario (10)</button>
                <button onclick="setFilter('t6')" id="filter-t6" class="filter-btn">Sistema Esquelético (10)</button>
                <button onclick="setFilter('t7')" id="filter-t7" class="filter-btn">Bonus Huesos (10)</button>
            </div>
        </div>

        <div id="questions-container" class="questions-list"></div>

        <div id="summary-card" class="summary-card hidden">
            <div class="trophy">🏆</div>
            <h2>¡Examen Finalizado!</h2>
            <p id="summary-text" style="color: #e0f2fe; max-width: 500px;">Has completado todas las preguntas de Anatomía Humana.</p>
            <div class="final-score" id="final-score">0 / 70 aciertos</div>
            <button onclick="resetQuiz()" class="reset-btn" style="background: white; color: #0284c7; font-weight: 700; padding: 12px 24px; font-size: 1rem;">
                Reiniciar Examen
            </button>
        </div>
    </main>

    <script>
        const questionsData = [
            // POSICIÓN Y PLANOS ANATÓMICOS
            {
                id: 1,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '1. ¿Cuál de las siguientes describe correctamente la posición anatómica?',
                options: [
                    { letter: 'A', text: 'De pie, palmas hacia atrás y pies juntos' },
                    { letter: 'B', text: 'De pie, cabeza y ojos hacia adelante, palmas hacia adelante' },
                    { letter: 'C', text: 'Sentado, brazos cruzados y palmas hacia arriba' },
                    { letter: 'D', text: 'De pie, brazos flexionados y palmas hacia el cuerpo' }
                ],
                correct: 'B',
                explanation: 'La posición anatómica estándar requiere estar de pie (en bipedestación), mirada al frente, extremidades superiores pendientes a los lados con las palmas orientadas hacia adelante y pies dirigidos hacia enfrente.'
            },
            {
                id: 2,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '2. ¿Qué plano divide el cuerpo en una porción derecha y una izquierda?',
                options: [
                    { letter: 'A', text: 'Frontal' },
                    { letter: 'B', text: 'Transversal' },
                    { letter: 'C', text: 'Sagital' },
                    { letter: 'D', text: 'Coronal' }
                ],
                correct: 'C',
                explanation: 'El plano sagital es un plano vertical orientado de adelante hacia atrás que divide el cuerpo en secciones derecha e izquierda.'
            },
            {
                id: 3,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '3. ¿Qué plano divide el cuerpo en porciones superior e inferior?',
                options: [
                    { letter: 'A', text: 'Sagital' },
                    { letter: 'B', text: 'Frontal' },
                    { letter: 'C', text: 'Coronal' },
                    { letter: 'D', text: 'Transversal' }
                ],
                correct: 'D',
                explanation: 'El plano transversal u horizontal es perpendicular al eje longitudinal del cuerpo, dividiéndolo en mitad superior (craneal) e inferior (caudal).'
            },
            {
                id: 4,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '4. ¿Qué plano divide el cuerpo en porciones anterior y posterior?',
                options: [
                    { letter: 'A', text: 'Frontal o coronal' },
                    { letter: 'B', text: 'Sagital' },
                    { letter: 'C', text: 'Transversal' },
                    { letter: 'D', text: 'Medio sagital' }
                ],
                correct: 'A',
                explanation: 'El plano frontal o coronal discurre de lado a lado dividiendo el cuerpo en una parte anterior (ventral) y otra posterior (dorsal).'
            },
            {
                id: 5,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '5. El plano sagital medio divide el cuerpo en:',
                options: [
                    { letter: 'A', text: 'Superior e inferior' },
                    { letter: 'B', text: 'Anterior y posterior' },
                    { letter: 'C', text: 'Derecha e izquierda iguales' },
                    { letter: 'D', text: 'Derecha e izquierda desiguales' }
                ],
                correct: 'C',
                explanation: 'El plano medio o sagital medio pasa exactamente por la línea media del cuerpo dividiéndolo en dos mitades simétricas (iguales).'
            },
            {
                id: 6,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '6. Una estructura que se encuentra más cerca de la línea media se describe como:',
                options: [
                    { letter: 'A', text: 'Lateral' },
                    { letter: 'B', text: 'Medial' },
                    { letter: 'C', text: 'Distal' },
                    { letter: 'D', text: 'Superficial' }
                ],
                correct: 'B',
                explanation: 'Medial indica que una estructura se encuentra más próxima al plano medio sagital del cuerpo.'
            },
            {
                id: 7,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '7. Una estructura ubicada más lejos de la línea media se denomina:',
                options: [
                    { letter: 'A', text: 'Medial' },
                    { letter: 'B', text: 'Proximal' },
                    { letter: 'C', text: 'Lateral' },
                    { letter: 'D', text: 'Profunda' }
                ],
                correct: 'C',
                explanation: 'Lateral significa que una estructura está más alejada del plano medio o línea media corporal.'
            },
            {
                id: 8,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '8. ¿Cuál término indica una estructura más cercana al origen de un miembro?',
                options: [
                    { letter: 'A', text: 'Distal' },
                    { letter: 'B', text: 'Proximal' },
                    { letter: 'C', text: 'Lateral' },
                    { letter: 'D', text: 'Inferior' }
                ],
                correct: 'B',
                explanation: 'Proximal se utiliza para indicar mayor cercanía a la raíz o punto de inserción del miembro en el tronco.'
            },
            {
                id: 9,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '9. ¿Cuál término indica una estructura más alejada del origen de un miembro?',
                options: [
                    { letter: 'A', text: 'Proximal' },
                    { letter: 'B', text: 'Medial' },
                    { letter: 'C', text: 'Distal' },
                    { letter: 'D', text: 'Superior' }
                ],
                correct: 'C',
                explanation: 'Distal indica que la estructura está más distante del punto de inserción de la extremidad.'
            },
            {
                id: 10,
                team: 't1',
                teamName: 'POSICIÓN Y PLANOS ANATÓMICOS',
                question: '10. Una estructura ubicada hacia la superficie corporal se describe como:',
                options: [
                    { letter: 'A', text: 'Profunda' },
                    { letter: 'B', text: 'Interna' },
                    { letter: 'C', text: 'Superficial' },
                    { letter: 'D', text: 'Distal' }
                ],
                correct: 'C',
                explanation: 'Superficial se refiere a lo ubicado hacia o cerca de la superficie externa de la piel.'
            },

            // MOVIMIENTOS ANATÓMICOS
            {
                id: 11,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '11. ¿Qué movimiento disminuye el ángulo entre dos estructuras?',
                options: [
                    { letter: 'A', text: 'Extensión' },
                    { letter: 'B', text: 'Flexión' },
                    { letter: 'C', text: 'Abducción' },
                    { letter: 'D', text: 'Rotación' }
                ],
                correct: 'B',
                explanation: 'La flexión es el movimiento articular que reduce el ángulo formado entre los huesos o partes del cuerpo.'
            },
            {
                id: 12,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '12. ¿Qué movimiento aumenta el ángulo entre dos estructuras?',
                options: [
                    { letter: 'A', text: 'Flexión' },
                    { letter: 'B', text: 'Aducción' },
                    { letter: 'C', text: 'Extensión' },
                    { letter: 'D', text: 'Pronación' }
                ],
                correct: 'C',
                explanation: 'La extensión incrementa o endereza el ángulo entre los huesos o partes anatómicas.'
            },
            {
                id: 13,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '13. Alejar una extremidad de la línea media se denomina:',
                options: [
                    { letter: 'A', text: 'Aducción' },
                    { letter: 'B', text: 'Abducción' },
                    { letter: 'C', text: 'Flexión' },
                    { letter: 'D', text: 'Retrusión' }
                ],
                correct: 'B',
                explanation: 'La abducción es el movimiento en el plano frontal que separa o aleja la extremidad del plano medio.'
            },
            {
                id: 14,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '14. Acercar una extremidad hacia la línea media se denomina:',
                options: [
                    { letter: 'A', text: 'Abducción' },
                    { letter: 'B', text: 'Aducción' },
                    { letter: 'C', text: 'Extensión' },
                    { letter: 'D', text: 'Elevación' }
                ],
                correct: 'B',
                explanation: 'La aducción aproxima o acerca una estructura hacia la línea media corporal.'
            },
            {
                id: 15,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '15. ¿Cuál movimiento ocurre alrededor de un eje longitudinal?',
                options: [
                    { letter: 'A', text: 'Rotación' },
                    { letter: 'B', text: 'Flexión' },
                    { letter: 'C', text: 'Abducción' },
                    { letter: 'D', text: 'Aducción' }
                ],
                correct: 'A',
                explanation: 'La rotación es el giro o vuelta de un segmento corporal alrededor de su propio eje longitudinal.'
            },
            {
                id: 16,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '16. Levantar una estructura hacia arriba corresponde a:',
                options: [
                    { letter: 'A', text: 'Descenso' },
                    { letter: 'B', text: 'Retrusión' },
                    { letter: 'C', text: 'Elevación' },
                    { letter: 'D', text: 'Protrusión' }
                ],
                correct: 'C',
                explanation: 'La elevación es el desplazamiento superior o levantamiento de una parte del cuerpo.'
            },
            {
                id: 17,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '17. Mover una estructura hacia abajo corresponde a:',
                options: [
                    { letter: 'A', text: 'Elevación' },
                    { letter: 'B', text: 'Descenso' },
                    { letter: 'C', text: 'Aducción' },
                    { letter: 'D', text: 'Supinación' }
                ],
                correct: 'B',
                explanation: 'El descenso o depresión mueve la estructura en dirección inferior o hacia abajo.'
            },
            {
                id: 18,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '18. ¿Cuál de los siguientes movimientos corresponde principalmente al antebrazo?',
                options: [
                    { letter: 'A', text: 'Inversión' },
                    { letter: 'B', text: 'Eversión' },
                    { letter: 'C', text: 'Pronación' },
                    { letter: 'D', text: 'Protrusión' }
                ],
                correct: 'C',
                explanation: 'La pronación y la supinación son rotaciones específicas del antebrazo que orientan la palma hacia atrás/abajo o hacia adelante/arriba.'
            },
            {
                id: 19,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '19. ¿Qué movimiento lleva la mandíbula hacia adelante?',
                options: [
                    { letter: 'A', text: 'Retrusión' },
                    { letter: 'B', text: 'Protrusión' },
                    { letter: 'C', text: 'Supinación' },
                    { letter: 'D', text: 'Inversión' }
                ],
                correct: 'B',
                explanation: 'La protrusión desplaza hacia adelante una estructura, como la mandíbula o la lengua.'
            },
            {
                id: 20,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '20. ¿Qué movimiento lleva la mandíbula hacia atrás?',
                options: [
                    { letter: 'A', text: 'Protrusión' },
                    { letter: 'B', text: 'Retrusión' },
                    { letter: 'C', text: 'Eversión' },
                    { letter: 'D', text: 'Elevación' }
                ],
                correct: 'B',
                explanation: 'La retrusión es el movimiento en dirección posterior para devolver una estructura adelantada a su posición previa.'
            },
            {
                id: 21,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '21. ¿Qué movimiento corresponde al giro de la planta del pie hacia medial?',
                options: [
                    { letter: 'A', text: 'Eversión' },
                    { letter: 'B', text: 'Inversión' },
                    { letter: 'C', text: 'Dorsiflexión' },
                    { letter: 'D', text: 'Flexión plantar' }
                ],
                correct: 'B',
                explanation: 'La inversión gira la planta del pie hacia el plano medio o en sentido medial.'
            },
            {
                id: 22,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '22. ¿Qué movimiento corresponde al giro de la planta del pie hacia lateral?',
                options: [
                    { letter: 'A', text: 'Inversión' },
                    { letter: 'B', text: 'Eversión' },
                    { letter: 'C', text: 'Pronación' },
                    { letter: 'D', text: 'Supinación' }
                ],
                correct: 'B',
                explanation: 'La eversión desplaza la planta del pie alejándola de la línea media hacia afuera (lateral).'
            },
            {
                id: 23,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '23. Llevar el pie hacia arriba, acercando el dorso del pie hacia la pierna, corresponde a:',
                options: [
                    { letter: 'A', text: 'Flexión plantar' },
                    { letter: 'B', text: 'Dorsiflexión' },
                    { letter: 'C', text: 'Eversión' },
                    { letter: 'D', text: 'Inversión' }
                ],
                correct: 'B',
                explanation: 'La dorsiflexión o flexión dorsal eleva el pie de modo que la cara dorsal se aproxima a la cara anterior de la pierna.'
            },
            {
                id: 24,
                team: 't2',
                teamName: 'MOVIMIENTOS ANATÓMICOS',
                question: '24. Ponerse de puntas implica principalmente:',
                options: [
                    { letter: 'A', text: 'Dorsiflexión' },
                    { letter: 'B', text: 'Flexión plantar' },
                    { letter: 'C', text: 'Pronación' },
                    { letter: 'D', text: 'Retrusión' }
                ],
                correct: 'B',
                explanation: 'La flexión plantar orienta el pie y los dedos hacia abajo, alejando el dorso del pie de la pierna, como al sostenerse de puntillas.'
            },

            // FASCIAS Y MEMBRANAS
            {
                id: 25,
                team: 't3',
                teamName: 'FASCIAS Y MEMBRANAS',
                question: '25. ¿Qué es la fascia?',
                options: [
                    { letter: 'A', text: 'Tejido muscular especializado' },
                    { letter: 'B', text: 'Tejido epitelial de protección' },
                    { letter: 'C', text: 'Tejido conectivo de soporte' },
                    { letter: 'D', text: 'Tejido óseo especializado' }
                ],
                correct: 'C',
                explanation: 'La fascia está constituida por tejido conectivo o conjuntivo denso que envuelve y sostiene las diferentes estructuras anatómicas.'

                    { letter: 'B', text: 'Fémur' },
                    { letter: 'C', text: 'Patela o rótula' },
                    { letter: 'D', text: 'Esternón' }
                ],
                correct: 'C',
                explanation: 'La patela/rótula es el principal hueso sesamoideo, desarrollado dentro del tendón del cuádriceps.'
            },
            {
                id: 66,
                team: 't7',
                teamName: 'BONUS: CLASIFICACIÓN Y ESTRUCTURA ÓSEA',
                question: '66. ¿Qué tipo de hueso tiene longitud predominante sobre el ancho y el grosor?',
                options: [
                    { letter: 'A', text: 'Corto' },
                    { letter: 'B', text: 'Plano' },
                    { letter: 'C', text: 'Largo' },
                    { letter: 'D', text: 'Irregular' }
                ],
                correct: 'C',
                explanation: 'Un hueso largo se caracteriza formalmente porque su dimensión longitudinal supera su anchura y grosor.'
            },
            {
                id: 67,
                team: 't7',
                teamName: 'BONUS: CLASIFICACIÓN Y ESTRUCTURA ÓSEA',
                question: '67. ¿Cuál de los siguientes grupos contiene solamente huesos largos?',
                options: [
                    { letter: 'A', text: 'Fémur, húmero y tibia' },
                    { letter: 'B', text: 'Carpos, tarsos y rótula' },
                    { letter: 'C', text: 'Esternón, costillas y escápula' },
                    { letter: 'D', text: 'Vértebras, carpos y esternón' }
                ],
                correct: 'A',
                explanation: 'El fémur, el húmero y la tibia son todos huesos pertenecientes a las extremidades de clasificación típica larga.'
            },
            {
                id: 68,
                team: 't7',
                teamName: 'BONUS: CLASIFICACIÓN Y ESTRUCTURA ÓSEA',
                question: '68. ¿Cuál de los siguientes grupos corresponde a huesos cortos?',
                options: [
                    { letter: 'A', text: 'Fémur y húmero' },
                    { letter: 'B', text: 'Carpos y tarsos' },
                    { letter: 'C', text: 'Esternón y costillas' },
                    { letter: 'D', text: 'Vértebras y coxales' }
                ],
                correct: 'B',
                explanation: 'Los carpos de la muñeca y tarsos del pie constituyen las familias características de huesos cortos.'
            },
            {
                id: 69,
                team: 't7',
                teamName: 'BONUS: CLASIFICACIÓN Y ESTRUCTURA ÓSEA',
                question: '69. ¿Qué estructura del hueso compacto contiene osteocitos?',
                options: [
                    { letter: 'A', text: 'Lagunas' },
                    { letter: 'B', text: 'Epífisis' },
                    { letter: 'C', text: 'Diáfisis' },
                    { letter: 'D', text: 'Periostio' }
                ],
                correct: 'A',
                explanation: 'Las lagunas u osteoplastos son los pequeños espacios de la matriz calcificada que albergan a los osteocitos.'
            },
            {
                id: 70,
                team: 't7',
                teamName: 'BONUS: CLASIFICACIÓN Y ESTRUCTURA ÓSEA',
                question: '70. ¿Qué estructuras conectan las lagunas entre sí y permiten la comunicación/nutrición de los osteocitos?',
                options: [
                    { letter: 'A', text: 'Trabéculas' },
                    { letter: 'B', text: 'Canalículos' },
                    { letter: 'C', text: 'Epífisis' },
                    { letter: 'D', text: 'Metáfisis' }
                ],
                correct: 'B',
                explanation: 'Los canalículos son microcanales que atraviesan la matriz interconectando las lagunas y permitiendo la transmisión de nutrientes entre osteocitos.'
            }
        ];

        let currentFilter = 'all';
        let userAnswers = {}; 
        let timerSeconds = 0;
        let timerInterval = null;
        let quizActive = true;

        window.onload = function() {
            startTimer();
            renderQuestions();
        };

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!quizActive) return;
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? questionsData 
                : questionsData.filter(q => q.team === currentFilter);

            filtered.forEach((q, index) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                const selectedOption = userAnswers[q.id];
                const isCorrect = selectedOption === q.correct;

                const card = document.createElement('div');
                card.className = `question-card ${isAnswered ? (isCorrect ? 'correct' : 'incorrect') : ''}`;

                let optionsHtml = '';
                q.options.forEach(opt => {
                    let btnClass = "option-btn";
                    let badgeHtml = "";

                    if (isAnswered) {
                        if (opt.letter === q.correct) {
                            btnClass += " opt-correct";
                            badgeHtml = '<span class="badge-status badge-correct">✓ Correcta</span>';
                        } else if (opt.letter === selectedOption) {
                            btnClass += " opt-incorrect";
                            badgeHtml = '<span class="badge-status badge-incorrect">✗ Tu respuesta</span>';
                        } else {
                            btnClass += " opt-disabled";
                        }
                    }

                    optionsHtml += `
                        <button onclick="selectOption(${q.id}, '${opt.letter}')" ${isAnswered ? 'disabled' : ''} class="${btnClass}">
                            <span class="option-letter">${opt.letter}</span>
                            <span>${opt.text}</span>
                            ${badgeHtml}
                        </button>
                    `;
                });

                let feedbackHtml = '';
                if (isAnswered) {
                    feedbackHtml = `
                        <div class="feedback-box ${isCorrect ? 'correct' : 'incorrect'}">
                            <div class="feedback-title">${isCorrect ? '¡Excelente! Respuesta Correcta' : 'Respuesta Incorrecta'}</div>
                            <div><strong>Explicación:</strong> ${q.explanation}</div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="q-meta">
                        <span class="q-team">${q.teamName}</span>
                        <span class="q-id">Pregunta ${index + 1} de ${filtered.length} (ID: ${q.id})</span>
                    </div>
                    <div class="q-text">${q.question}</div>
                    <div class="options-list">${optionsHtml}</div>
                    ${feedbackHtml}
                `;

                container.appendChild(card);
            });

            updateScoreUI();
        }

        function selectOption(questionId, letter) {
            if (userAnswers[questionId] !== undefined) return;
            userAnswers[questionId] = letter;
            renderQuestions();
        }

        function updateScoreUI() {
            const totalAnswered = Object.keys(userAnswers).length;
            let correctCount = 0;
            
            for (const id in userAnswers) {
                const q = questionsData.find(item => item.id == id);
                if (q && userAnswers[id] === q.correct) {
                    correctCount++;
                }
            }

            document.getElementById('score-display').innerText = `${correctCount} / ${questionsData.length}`;
            
            if (totalAnswered === questionsData.length && quizActive) {
                quizActive = false;
                clearInterval(timerInterval);
                const summaryCard = document.getElementById('summary-card');
                const finalScore = document.getElementById('final-score');
                const summaryText = document.getElementById('summary-text');
                
                finalScore.innerText = `${correctCount} / ${questionsData.length} aciertos`;
                if (correctCount === questionsData.length) {
                    summaryText.innerText = "¡Impresionante! Tienes un dominio absoluto de todos los temas de Anatomía Humana.";
                } else if (correctCount >= 55) {
                    summaryText.innerText = "¡Excelente desempeño! Tienes bases muy sólidas en anatomía.";
                } else {
                    summaryText.innerText = "Buen esfuerzo. Te recomendamos revisar los temas donde tuviste desaciertos para afianzar tu repaso.";
                }
                summaryCard.classList.remove('hidden');
                summaryCard.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function resetQuiz() {
            userAnswers = {};
            timerSeconds = 0;
            quizActive = true;
            document.getElementById('summary-card').classList.add('hidden');
            startTimer();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
